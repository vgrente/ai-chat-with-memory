plugins {
	id 'org.jetbrains.kotlin.jvm' version '2.3.21'
	id 'org.jetbrains.kotlin.plugin.spring' version '2.3.21'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id "org.sonarqube" version "7.3.1.8318"
	id 'jacoco'
	id 'dev.detekt' version '2.0.0-alpha.6'
	id 'org.jlleitschuh.gradle.ktlint' version '14.2.0'
}

group = 'io.vgrente'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springAiVersion', "2.0.1")
	set('springModulithVersion', "2.1.1")
	set('testcontainersVersion', "2.0.5")
	set('arconiaVersion', "0.30.0")
	set('mockitoKotlinVersion', "5.4.0")
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.modulith:spring-modulith-starter-core'
	implementation 'org.jetbrains.kotlin:kotlin-reflect'
	implementation 'org.springframework.ai:spring-ai-starter-model-google-genai'
	implementation 'org.springframework.ai:spring-ai-starter-model-chat-memory-repository-jdbc'
	implementation 'tools.jackson.module:jackson-module-kotlin'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'

	runtimeOnly 'org.postgresql:postgresql'
	runtimeOnly("org.flywaydb:flyway-database-postgresql")

	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	testAndDevelopmentOnly 'io.arconia:arconia-dev-services-postgresql'

	testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
	testImplementation 'org.springframework.modulith:spring-modulith-docs'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jdbc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.jetbrains.kotlin:kotlin-test-junit5'
	testImplementation "org.mockito.kotlin:mockito-kotlin:${mockitoKotlinVersion}"
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.modulith:spring-modulith-bom:${springModulithVersion}"
		mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
		mavenBom "io.arconia:arconia-bom:${arconiaVersion}"
		mavenBom "org.testcontainers:testcontainers-bom:${testcontainersVersion}"
	}
}

kotlin {
	compilerOptions {
		freeCompilerArgs.addAll '-Xjsr305=strict', '-Xannotation-default-target=param-property'
	}
}

detekt {
	toolVersion = "2.0.0-alpha.6"
	buildUponDefaultConfig = true
	baseline = file("config/detekt/baseline.xml")
}

configurations.named('detekt') {
	resolutionStrategy.eachDependency {
		if (requested.group == 'org.jetbrains.kotlin') {
			useVersion '2.4.10'
		}
	}
}

tasks.named('detekt').configure {
	reports {
		checkstyle.required.set(true)
		html.required.set(true)
	}
}

ktlint {
	verbose.set(true)
	outputToConsole.set(true)
	reporters {
		reporter org.jlleitschuh.gradle.ktlint.reporter.ReporterType.PLAIN
		reporter org.jlleitschuh.gradle.ktlint.reporter.ReporterType.CHECKSTYLE
	}
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy tasks.jacocoTestReport
}

tasks.named('jacocoTestReport') {
	dependsOn tasks.test
	reports {
		xml.required = true
		html.required = true
	}
}

tasks.register('generateModuleDiagram', JavaExec) {
	group = 'documentation'
	description = 'Renders the Spring Modulith module structure as Mermaid into README.md'
	dependsOn tasks.testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'io.vgrente.aichatwithmemory.docs.GenerateModuleDiagramKt'
}

tasks.named('build') {
	dependsOn tasks.generateModuleDiagram
}
